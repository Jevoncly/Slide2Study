[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slide2study"
version = "0.1.0"
description = "Structure-aware retrieval baseline for turning course slides into cited study material"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Slide2Study contributors"}]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=4.0", "python-pptx>=0.6.23"]
vision = ["pillow>=10.0", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
slide2study = "slide2study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
